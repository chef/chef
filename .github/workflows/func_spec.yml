---
name: func_spec

"on":
  pull_request_target:
    branches: [main, "chef-*"]
  push:
    branches: [main, "chef-*"]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: func-spec-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CHEF_LICENSE: accept-no-persist
  FORCE_FFI_YAJL: ext

jobs:
  workflow_guard:
    uses: chef/chef/.github/workflows/workflow-change-guard.yml@main
    permissions:
      contents: read

  config:
    needs: workflow_guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      x86_tag: ${{ steps.tags.outputs.x86_tag }}
      arm_tag: ${{ steps.tags.outputs.arm_tag }}
    steps:
      - id: tags
        run: |
          echo "x86_tag=3.0.39" >> $GITHUB_OUTPUT
          echo "arm_tag=aarch64" >> $GITHUB_OUTPUT

  functional:
    needs: workflow_guard
    permissions:
      contents: read
    env:
      HAB_AUTH_TOKEN: ${{ secrets.HAB_AUTH_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-2022
          - windows-2025
          - macos-14
          - macos-15
        ruby: ["3.4"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
      - name: Install native deps (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libarchive-dev libffi-dev libyaml-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - run: |
          # Disable Git's background auto-maintenance/GC/commit-graph writers so
          # they can't mutate Bundler's shared git cache repo (for our git-sourced
          # Gemfile deps: ohai, cheffish, rest-client) while another process is
          # concurrently cloning/hardlinking from it -- avoids intermittent
          # "fatal: hardlink different from source" bundle install failures.
          # See https://github.com/dependabot/dependabot-core/issues/15827.
          git config --global maintenance.auto false
          git config --global gc.auto 0
          git config --global fetch.writeCommitGraph false
          bundle install
      - name: Configure WinRM for functional tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: winrm quickconfig -q
      - name: Install core/libarchive via Habitat (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # archive_file's specs need a real libarchive DLL to load
          # (Archive::Reader), and since chef is Habitat-packaged, that
          # dependency must come from the same Habitat package
          # (core/libarchive) declared in habitat/x86_64-windows/plan.ps1,
          # not a Chocolatey/vcpkg substitute.
          #
          # The DLL directory is added directly to PATH (not just
          # registered via RubyInstaller::Runtime.add_dll_directory /
          # RUBY_DLL_PATH's AddDllDirectory-based mechanism) because the
          # ffi gem's ffi_lib -- used by ffi-libarchive to load archive.dll
          # -- calls the plain Win32 LoadLibraryW with no search-scope
          # flags. That classic call honors PATH but ignores directories
          # registered via AddDllDirectory, which only take effect for
          # LoadLibraryEx calls made with the LOAD_LIBRARY_SEARCH_* flags
          # that ffi_lib does not use.
          & "${{ github.workspace }}\.expeditor\scripts\ensure-minimum-viable-hab.ps1"
          $env:PATH = "C:\Program Files\Habitat;" + $env:PATH
          echo "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          hab license accept
          hab pkg install core/libarchive --channel base-2025 --binlink --force
          $libarchive_dir = (hab pkg path core/libarchive).Trim() + "/bin"
          Add-Content -Path $env:GITHUB_PATH -Value $libarchive_dir
      - name: Set RUBY_DLL_PATH for chef-powershell (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gem_lib = gem which chef-powershell 2>$null | Select-Object -First 1
          if ($gem_lib) {
            $gem_path = Split-Path $gem_lib | Split-Path
            echo "RUBY_DLL_PATH=$gem_path/bin/ruby_bin_folder/$env:PROCESSOR_ARCHITECTURE" >> $env:GITHUB_ENV
          }
      - name: Fix Windows PowerShell module paths for subprocesses (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Propagate the machine-level PSModulePath into GITHUB_ENV so that
          # all child processes (including powershell.exe -NoProfile subshells
          # spawned by specs) inherit it. Without this the Security module DLL
          # cannot be resolved when starting PS5.1 from a D:\ working dir.
          $machinePath = [System.Environment]::GetEnvironmentVariable("PSModulePath", "Machine")
          echo "PSModulePath=$machinePath" >> $env:GITHUB_ENV
      - name: Install NuGet PackageProvider for functional tests (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -Force -ErrorAction SilentlyContinue
      - run: bundle exec rake spec:functional

  functional-docker:
    needs: [config, workflow_guard]
    permissions:
      contents: read
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            container: chefes/omnibus-toolchain-rocky-9:${{ needs.config.outputs.x86_tag }}
            pkg_mgr: dnf
            label: rocky-9-x86
          - runs-on: ubuntu-24.04-arm
            container: chefes/omnibus-toolchain-rocky-9:${{ needs.config.outputs.arm_tag }}
            pkg_mgr: dnf
            label: rocky-9-arm
          - runs-on: ubuntu-24.04
            container: chefes/omnibus-toolchain-rocky-8:${{ needs.config.outputs.x86_tag }}
            pkg_mgr: dnf
            label: rocky-8-x86
          - runs-on: ubuntu-24.04-arm
            container: chefes/omnibus-toolchain-rocky-8:${{ needs.config.outputs.arm_tag }}
            pkg_mgr: dnf
            label: rocky-8-arm
          - runs-on: ubuntu-24.04
            container: chefes/omnibus-toolchain-debian-11:${{ needs.config.outputs.x86_tag }}
            pkg_mgr: apt
            label: debian-11-x86
          - runs-on: ubuntu-24.04-arm
            container: chefes/omnibus-toolchain-debian-11:${{ needs.config.outputs.arm_tag }}
            pkg_mgr: apt
            label: debian-11-arm
    runs-on: ${{ matrix.runs-on }}
    container:
      image: ${{ matrix.container }}
      options: --privileged
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
      - name: Install native deps (dnf)
        if: matrix.pkg_mgr == 'dnf'
        run: dnf install -y --enablerepo=devel openssl-devel libarchive-devel libffi-devel libyaml-devel readline-devel zlib-devel
      - name: Install native deps (apt)
        if: matrix.pkg_mgr == 'apt'
        run: |
          # Debian 11 (bullseye) has moved past LTS into the frozen
          # "oldoldstable-security" suite, so deb.debian.org no longer
          # reliably serves its InRelease/pool files (expired Release
          # + 404s on package downloads). Pin to an immutable
          # snapshot.debian.org mirror instead of the rolling mirror.
          cat <<'EOF' > /etc/apt/sources.list
          deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20260901T000000Z bullseye main
          deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/20260901T000000Z bullseye-security main
          deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20260901T000000Z bullseye-updates main
          EOF
          apt-get update
          apt-get install -y libssl-dev libarchive-dev libffi-dev libyaml-dev libreadline-dev zlib1g-dev curl
      - name: Install Ruby via rbenv
        run: |
          curl -fsSL https://github.com/rbenv/rbenv-installer/raw/HEAD/bin/rbenv-installer | bash
          export PATH="$HOME/.rbenv/bin:$PATH"
          eval "$(rbenv init -)"
          rbenv install 3.4.8
          rbenv global 3.4.8
          gem install bundler
          echo "$HOME/.rbenv/bin" >> $GITHUB_PATH
          echo "$HOME/.rbenv/shims" >> $GITHUB_PATH
      - run: |
          # Disable Git's background auto-maintenance/GC/commit-graph writers so
          # they can't mutate Bundler's shared git cache repo (for our git-sourced
          # Gemfile deps: ohai, cheffish, rest-client) while another process is
          # concurrently cloning/hardlinking from it -- avoids intermittent
          # "fatal: hardlink different from source" bundle install failures.
          # See https://github.com/dependabot/dependabot-core/issues/15827.
          git config --global maintenance.auto false
          git config --global gc.auto 0
          git config --global fetch.writeCommitGraph false
          bundle install
      - run: bundle exec rake spec:functional

  choco:
    needs: workflow_guard
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        ruby: ["3.4"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        allow-unsafe-pr-checkout: true
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
        clean: true
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: false
    - run: |
        gem uninstall date --all --ignore-dependencies || true
        gem install date --version 3.3.3 --platform=ruby
        # Disable Git's background auto-maintenance/GC/commit-graph writers so
        # they can't mutate Bundler's shared git cache repo (for our git-sourced
        # Gemfile deps: ohai, cheffish, rest-client) while another process is
        # concurrently cloning/hardlinking from it -- avoids intermittent
        # "fatal: hardlink different from source" bundle install failures.
        # See https://github.com/dependabot/dependabot-core/issues/15827.
        git config --global maintenance.auto false
        git config --global gc.auto 0
        git config --global fetch.writeCommitGraph false
        bundle install
        bundle exec rspec spec/functional/resource/chocolatey_package_spec.rb
  userdefaults:
    needs: workflow_guard
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
        ruby: ["3.4"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        allow-unsafe-pr-checkout: true
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
        clean: true
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: false
    - run: |
        # Disable Git's background auto-maintenance/GC/commit-graph writers so
        # they can't mutate Bundler's shared git cache repo (for our git-sourced
        # Gemfile deps: ohai, cheffish, rest-client) while another process is
        # concurrently cloning/hardlinking from it -- avoids intermittent
        # "fatal: hardlink different from source" bundle install failures.
        # See https://github.com/dependabot/dependabot-core/issues/15827.
        git config --global maintenance.auto false
        git config --global gc.auto 0
        git config --global fetch.writeCommitGraph false
        bundle install
    - run: sudo bundle exec rspec spec/functional/resource/macos_userdefaults_spec.rb
