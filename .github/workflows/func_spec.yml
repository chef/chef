---
name: func_spec

"on":
  pull_request:
  push:
    branches:
      - chef-18

concurrency:
  group: func-specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  choco:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
        # Due to https://github.com/actions/runner/issues/849, we have to use quotes for '3.0'
        ruby: ['3.1']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: false
    - run: |
        if ([string]::IsNullOrWhiteSpace($env:HAB_AUTH_TOKEN)) {
          throw "HAB_AUTH_TOKEN was not supplied to this workflow step"
        }

        Write-Output "HAB_AUTH_TOKEN is configured for this workflow step"

        ruby -e "abort 'Ruby cannot see HAB_AUTH_TOKEN' if ENV['HAB_AUTH_TOKEN'].to_s.empty?; puts 'Ruby can see HAB_AUTH_TOKEN'"

        ruby post-bundle-install.rb
      shell: pwsh
      env:
        HAB_AUTH_TOKEN: ${{ secrets.HAB_AUTH_TOKEN }}
    - run: |
        gem uninstall date --all --ignore-dependencies || true
        gem install date --version 3.3.3 --platform=ruby
        bundle install
        # Build the Git-sourced chef-powershell gem to test compatibility before it is released.
        ruby post-bundle-install.rb
        bundle exec rspec spec/functional/resource/chocolatey_package_spec.rb
      env:
        HAB_AUTH_TOKEN: ${{ secrets.HAB_AUTH_TOKEN }}
        HAB_LICENSE: accept-no-persist
        HAB_ORIGIN: chef
        HAB_BLDR_CHANNEL: base-2025
        HAB_BLDR_REFRESH_CHANNEL: base-2025
  userdefaults:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
        # Due to https://github.com/actions/runner/issues/849, we have to use quotes for '3.0'
        ruby: ['3.1']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: false
    - run: bundle install
    - run: sudo bundle exec rspec spec/functional/resource/macos_userdefaults_spec.rb
