---
name: lint

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: lint-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cookstyle:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: ruby_shadow:packaging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: 3.4
          bundler-cache: false
      - uses: r7kamura/rubocop-problem-matchers-action@59f1a0759f50cc2649849fd850b8487594bb5a81 # v1 - this shows the failures in the PR
      - run: |
          # Disable Git's background auto-maintenance/GC/commit-graph writers so
          # they can't mutate Bundler's shared git cache repo (for our git-sourced
          # Gemfile deps: ohai, cheffish, rest-client) while another process is
          # concurrently cloning/hardlinking from it -- avoids intermittent
          # "fatal: hardlink different from source" bundle install failures.
          # See https://github.com/dependabot/dependabot-core/issues/15827.
          git config --global maintenance.auto false
          git config --global gc.auto 0
          git config --global fetch.writeCommitGraph false
          bundle install
          bundle exec cookstyle --chefstyle -c .rubocop.yml

  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2

  linelint:
    runs-on: ubuntu-latest
    name: Check if all files end in newline
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Linelint
        uses: fernandrone/linelint@7907a5dca0c28ea7dd05c6d8d8cacded713aca11 # master
        id: linelint
