---
name: unit_specs

"on":
  pull_request_target:
    branches: [main, "chef-*"]
  push:
    branches: [main, "chef-*"]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: unit-specs-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CHEF_LICENSE: accept-no-persist
  FORCE_FFI_YAJL: ext

jobs:
  workflow_guard:
    uses: chef/chef/.github/workflows/workflow-change-guard.yml@main
    permissions:
      contents: read

  config:
    needs: workflow_guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      x86_tag: ${{ steps.tags.outputs.x86_tag }}
      arm_tag: ${{ steps.tags.outputs.arm_tag }}
    steps:
      - id: tags
        run: |
          echo "x86_tag=3.0.39" >> $GITHUB_OUTPUT
          echo "arm_tag=aarch64" >> $GITHUB_OUTPUT

  unit:
    needs: workflow_guard
    permissions:
      contents: read
    env:
      HAB_AUTH_TOKEN: ${{ secrets.HAB_AUTH_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-2022
          - windows-2025
          - macos-14
          - macos-15
        ruby: ["3.4"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Configure git line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v7
        with:
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
      - name: Install native deps (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libarchive-dev libffi-dev libyaml-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - name: Create unit test node fixtures
        run: mkdir -p spec/data/nodes && touch spec/data/nodes/test.rb spec/data/nodes/default.rb spec/data/nodes/test.example.com.rb
        shell: bash
      - name: Bundle install
        run: |
          # `core.hardlinks false` (previously here) is not a real Git config
          # option and has no effect (Git always hardlinks .git/objects on a
          # same-filesystem local clone regardless of it). The actual fix for
          # intermittent "hardlink different from source" clone failures is
          # to stop Git's background auto-maintenance/GC/commit-graph writers
          # from mutating Bundler's shared git cache repo while another
          # process is concurrently cloning/hardlinking from it. See
          # https://github.com/dependabot/dependabot-core/issues/15827 for a
          # detailed writeup of the same failure signature.
          git config --global maintenance.auto false
          git config --global gc.auto 0
          git config --global fetch.writeCommitGraph false
          bundle install
        shell: bash
      - name: Install core/libarchive via Habitat (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # archive_file's specs need a real libarchive DLL to load
          # (Archive::Reader), and since chef is Habitat-packaged, that
          # dependency must come from the same Habitat package
          # (core/libarchive) declared in habitat/x86_64-windows/plan.ps1,
          # not a Chocolatey/vcpkg substitute.
          & "${{ github.workspace }}\.expeditor\scripts\ensure-minimum-viable-hab.ps1"
          $env:PATH = "C:\Program Files\Habitat;" + $env:PATH
          echo "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          hab license accept
          hab pkg install core/libarchive --channel base-2025 --binlink --force
          $libarchive_dir = (hab pkg path core/libarchive).Trim()
          echo "LIBARCHIVE_DLL_DIR=$libarchive_dir/bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Set RUBY_DLL_PATH for chef-powershell and libarchive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll_paths = @()
          $gem_lib = gem which chef-powershell 2>$null | Select-Object -First 1
          if ($gem_lib) {
            $gem_path = Split-Path $gem_lib | Split-Path
            $dll_paths += "$gem_path/bin/ruby_bin_folder/$env:PROCESSOR_ARCHITECTURE"
          }
          if ($env:LIBARCHIVE_DLL_DIR) {
            $dll_paths += $env:LIBARCHIVE_DLL_DIR
          }
          if ($dll_paths.Count -gt 0) {
            echo "RUBY_DLL_PATH=$($dll_paths -join ';')" >> $env:GITHUB_ENV
          }
      - run: bundle exec rake spec:unit
      - run: bundle exec rake component_specs

  unit-docker:
    needs: [config, workflow_guard]
    permissions:
      contents: read
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            container: chefes/omnibus-toolchain-rocky-9:${{ needs.config.outputs.x86_tag }}
            pkg_mgr: dnf
            label: rocky-9-x86
          - runs-on: ubuntu-24.04-arm
            container: chefes/omnibus-toolchain-rocky-9:${{ needs.config.outputs.arm_tag }}
            pkg_mgr: dnf
            label: rocky-9-arm
          - runs-on: ubuntu-24.04
            container: chefes/omnibus-toolchain-rocky-8:${{ needs.config.outputs.x86_tag }}
            pkg_mgr: dnf
            label: rocky-8-x86
          - runs-on: ubuntu-24.04-arm
            container: chefes/omnibus-toolchain-rocky-8:${{ needs.config.outputs.arm_tag }}
            pkg_mgr: dnf
            label: rocky-8-arm
          - runs-on: ubuntu-24.04
            container: chefes/omnibus-toolchain-debian-11:${{ needs.config.outputs.x86_tag }}
            pkg_mgr: apt
            label: debian-11-x86
          - runs-on: ubuntu-24.04-arm
            container: chefes/omnibus-toolchain-debian-11:${{ needs.config.outputs.arm_tag }}
            pkg_mgr: apt
            label: debian-11-arm
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
      - name: Install native deps (dnf)
        if: matrix.pkg_mgr == 'dnf'
        run: dnf install -y --enablerepo=devel openssl-devel libarchive-devel libffi-devel libyaml-devel readline-devel zlib-devel
      - name: Install native deps (apt)
        if: matrix.pkg_mgr == 'apt'
        run: |
          # Debian 11 (bullseye) has moved past LTS into the frozen
          # "oldoldstable-security" suite, so deb.debian.org no longer
          # reliably serves its InRelease/pool files (expired Release
          # + 404s on package downloads). Pin to an immutable
          # snapshot.debian.org mirror instead of the rolling mirror.
          cat <<'EOF' > /etc/apt/sources.list
          deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20260901T000000Z bullseye main
          deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/20260901T000000Z bullseye-security main
          deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20260901T000000Z bullseye-updates main
          EOF
          apt-get update
          apt-get install -y libssl-dev libarchive-dev libffi-dev libyaml-dev libreadline-dev zlib1g-dev curl
      - name: Install Ruby via rbenv
        run: |
          curl -fsSL https://github.com/rbenv/rbenv-installer/raw/HEAD/bin/rbenv-installer | bash
          export PATH="$HOME/.rbenv/bin:$PATH"
          eval "$(rbenv init -)"
          rbenv install 3.4.8
          rbenv global 3.4.8
          gem install bundler
          echo "$HOME/.rbenv/bin" >> $GITHUB_PATH
          echo "$HOME/.rbenv/shims" >> $GITHUB_PATH
      - name: Create unit test node fixtures
        run: mkdir -p spec/data/nodes && touch spec/data/nodes/test.rb spec/data/nodes/default.rb spec/data/nodes/test.example.com.rb
      - name: Bundle install
        run: |
          # `core.hardlinks false` (previously here) is not a real Git config
          # option and has no effect (Git always hardlinks .git/objects on a
          # same-filesystem local clone regardless of it). The actual fix for
          # intermittent "hardlink different from source" clone failures is
          # to stop Git's background auto-maintenance/GC/commit-graph writers
          # from mutating Bundler's shared git cache repo while another
          # process is concurrently cloning/hardlinking from it. See
          # https://github.com/dependabot/dependabot-core/issues/15827 for a
          # detailed writeup of the same failure signature.
          git config --global maintenance.auto false
          git config --global gc.auto 0
          git config --global fetch.writeCommitGraph false
          bundle install
      - run: bundle exec rake spec:unit
      - run: bundle exec rake component_specs
