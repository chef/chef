# stub to call common GitHub Action (GA) as part of Continuous Integration (CI) Pull Request process checks for Chef main Branch
# inputs are described in the chef/common-github-actions/<GA.yml> with same name as this stub
#
# secrets are inherited from the calling workflow, typically SONAR_TOKEN, SONAR_HOST_URL, GH_TOKEN, AKEYLESS_JWT_ID, POLARIS_SERVER_URL and POLARIS_ACCESS_TOKEN

name: CI Pull Request on Chef Main Branch

on:
  pull_request:
    branches: [ main, release/** ]
  push:
    branches: [ main, release/** ]

  workflow_dispatch:

permissions:
  contents: read

env:
  STUB_VERSION: "1.0.5"

jobs:
  echo_version:
    name: 'Echo stub version'
    runs-on: ubuntu-latest
    steps:
      - name: echo version of stub and inputs
        run: |
          echo "CI main pull request stub version $STUB_VERSION"

  call-ci-main-pr-check-pipeline:
    uses: chef/common-github-actions/.github/workflows/ci-main-pull-request.yml@main
    secrets: inherit
    permissions:
      id-token: write
      contents: read

    with:
      visibility: ${{ github.event.repository.visibility }}   #  private, public, or internal
      # go-private-modules: GOPRIVATE for Go private modules, default is 'github.com/progress-platform-services/*

      # detect-policy-check-fail-on-severities: none  # Only block SBOM upload on blocker-level prior step failures
      # blackduck-break-build: false  # Prevents build failure on Black Duck policy violations (e.g., C# i18n CVE)
      # bridge-break: false # Prevents build failure on Bridge violations
      # These options were in a chef-infra specific version. Commenting them out as a reference in case we need them at some point.

      # if version specified, it takes precedence; can be a semver like 1.0.2-xyz or a tag like "latest"
      version: '19.4' # ${{ github.event.repository.version }}
      detect-version-source-type: 'none' # options include "none" (do not detect), "file", "github-tag" or "github-release"
      detect-version-source-parameter: '' # use for file name
      language: 'ruby'  # options include "autodetect", "ruby", "go", "node", "python", "java", "dotnet", "c/c++", "other"

      # complexity-checks
      perform-complexity-checks: true
      # scc-output-filename: 'scc-output.txt'
      perform-language-linting: false    # Perform language-specific linting and pre-compilation checks

      # grype vulnerability scan on source code (runs on push/merge to main, not on PRs)
      perform-grype-scan: ${{ github.event_name == 'push' }}

      # trufflehog secret scanning
      perform-trufflehog-scan: true

      # ADDED TRIVY SCAN
      # perform-trivy-scan: true # Commented out 23 March 2026 because of a nasty security vulnerability in trivy that is being fixed, but no ETA on fix.

      # BlackDuck SAST (Polaris) and SCA scans (requires a build or download to do SAST)
      # requires these secrets: POLARIS_SERVER_URL, POLARIS_ACCESS_TOKEN
      perform-blackduck-polaris: ${{ github.event_name == 'push' }}
      polaris-application-name: "Chef-Agents"  # one of these: Chef-Agents, Chef-Automate, Chef-Chef360, Chef-Habitat, Chef-Infrastructure-Server, Chef-Shared-Services, Chef-Other
      polaris-project-name: 'chef-19'
      # polaris-blackduck-executable: 'path/to/blackduck/binary'
      # polaris-executable-detect-path: 'path/to/detect'

      # perform application build and unit testing, will use custom repository properties when implemented for chef-primary-application, chef-build-profile, and chef-build-language
      build: false
      # ga-build-profile: $chef-ga-build-profile
      # language: $chef-ga-build-language   # this will be removed from stub as autodetected in central GA
      unit-tests: false

      # perform SonarQube scan, with or without unit test coverage data
      # requires secrets SONAR_TOKEN and SONAR_HOST_URL (progress.sonar.com)
      perform-sonarqube-scan: false
      # perform-sonar-build: true
      # build-profile: 'default'
      # report-unit-test-coverage: true

      # report to central developer dashboard
      report-to-atlassian-dashboard: false
      # quality-product-name: 'Chef-client'   # product name for quality reporting, like Chef360, Courier, Inspec
      quality-product-name: 'chef-19'   # like 'Chef-360' - the product name for quality reporting, like Chef360, Courier, Inspec
      # quality-sonar-app-name: 'YourSonarAppName'
      # quality-testing-type: 'Integration' like Unit, Integration, e2e, api, Performance, Security
      # quality-service-name: 'YourServiceOrRepoName'
      # quality-junit-report: 'path/to/junit/report''

      # perform native and Habitat packaging, publish to package repositories
      package-binaries: false     # Package binaries (e.g., RPM, DEB, MSI, dpkg + signing + SHA)
      habitat-build: false        # Create Habitat packages
      publish-packages: false     # Publish packages (e.g., container from Dockerfile to ECR, go-releaser binary to releases page, Habitat packages to package repositories and Artifactory to artifactory, gems, choco, homebrew, other app stores)

      # generate and export Software Bill of Materials (SBOM) in various formats
      generate-sbom: true
      export-github-sbom: true      # SPDX JSON artifact on job instance
      perform-blackduck-sca-scan: ${{ github.event_name == 'push' }} # combined with generate sbom & generate github-sbom, also needs version above
      blackduck-project-group-name: 'Chef-Agents' # typically one of (Chef), Chef-Agents, Chef-Automate, Chef-Chef360, Chef-Habitat, Chef-Infrastructure-Server, Chef-Shared-Services'
      blackduck-project-name: 'chef' # BlackDuck project name, typically the repository name
      generate-blackduck-sbom: ${{ github.event_name == 'push' }} # obsolete, use perform-blackduck-sca-scan instead

      generate-msft-sbom: false
      license_scout: false          # Run license scout for license compliance (uses .license_scout.yml)

      # udf1: 'default' # user defined flag 1
      # udf2: 'default' # user defined flag 2
      # udf3: 'default' # user defined flag 3

  # ---------------------------------------------------------------------------
  # Habitat native dep SBOM generation + BlackDuck import
  #
  # Motivation: BlackDuck Detect runs only the Ruby/Bundler detector, missing
  # all Habitat native runtime deps (openssl, libxml2, glibc, etc.) and their
  # transitive closure. This job generates a CycloneDX SBOM from the plan.sh
  # pkg_deps + Builder API tdeps and uploads it directly to the same BD
  # project/version the SCA scan created above.
  #
  # Runs after the main pipeline so BD has already created the project version.
  # NOTE: needs: is intentionally omitted — GitHub Actions skips jobs that
  # depend on reusable workflow call jobs when triggered via workflow_dispatch.
  # autocreate=true handles the edge case where ordering races.
  # ---------------------------------------------------------------------------
  generate-habitat-sbom:
    name: 'Generate Habitat SBOM and Import to BlackDuck'
    runs-on: ubuntu-latest
    env:
      BD_PROJECT_NAME: 'chef'
      BD_VERSION_NAME: '19.4'

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler: none

      - name: Generate per-platform Habitat CycloneDX SBOMs
        env:
          HAB_AUTH_TOKEN: ${{ secrets.HAB_AUTH_TOKEN }}
        run: ruby scripts/sbom/generate_habitat_sbom.rb

      - name: Install CycloneDX CLI
        run: |
          curl -sSL https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/cyclonedx-linux-x64 \
            -o /usr/local/bin/cyclonedx-cli
          chmod +x /usr/local/bin/cyclonedx-cli

      - name: Merge per-platform SBOMs
        run: |
          cyclonedx-cli merge \
            --input-files habitat-components-x86_64-linux.cdx.json \
                          habitat-components-aarch64-linux.cdx.json \
                          habitat-components-aarch64-darwin.cdx.json \
                          habitat-components-x86_64-windows.cdx.json \
            --output-file sbom-all-platforms.json \
            --output-format json \
            --output-version v1_4

          # Inject serialNumber so BD treats each push as a distinct scan (prevents "already mapped" errors)
          jq --arg serial "urn:uuid:chef-infra-client-${BD_VERSION_NAME}" \
             --arg ver    "${BD_VERSION_NAME}" \
             '.serialNumber = $serial | .metadata.component.version = $ver' \
            sbom-all-platforms.json > sbom-versioned.json
          mv sbom-versioned.json sbom-all-platforms.json

          # Deduplicate by name+version — cyclonedx-cli merge can produce duplicates across platforms
          jq '.components |= (group_by(.name + "@" + .version) | map(.[0]))' \
            sbom-all-platforms.json > sbom-deduped.json
          mv sbom-deduped.json sbom-all-platforms.json
          echo "Components after merge+dedup: $(jq '.components|length' sbom-all-platforms.json)"

      - name: Canonicalize PURLs against BlackDuck KB
        if: github.event_name != 'pull_request'
        env:
          BD_URL: ${{ secrets.BLACKDUCK_SBOM_URL }}
          BD_TOKEN: ${{ secrets.BLACKDUCK_SCA_TOKEN }}
        run: bash scripts/sbom/canonicalize_bd_purls.sh sbom-all-platforms.json

      - name: Upload merged SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: habitat-cyclonedx-sbom-all-platforms
          path: sbom-all-platforms.json
          retention-days: 90

      - name: Import SBOM into BlackDuck
        if: github.event_name != 'pull_request'
        env:
          BLACKDUCK_URL: ${{ secrets.BLACKDUCK_SBOM_URL }}
          BLACKDUCK_API_TOKEN: ${{ secrets.BLACKDUCK_SCA_TOKEN }}
        run: |
          set -euo pipefail

          BEARER=$(curl -sSf -X POST \
            "${BLACKDUCK_URL}/api/tokens/authenticate" \
            -H "Authorization: token ${BLACKDUCK_API_TOKEN}" \
            -H "Accept: application/vnd.blackducksoftware.user-4+json" \
            | jq -r '.bearerToken')
          if [ -z "${BEARER}" ] || [ "${BEARER}" = "null" ]; then
            echo "ERROR: Failed to obtain BlackDuck bearer token." && exit 1
          fi

          # URL-encode names — BD_VERSION_NAME may contain semver '+' or other reserved chars
          BD_PROJECT_ENCODED=$(printf '%s' "${BD_PROJECT_NAME}" | jq -sRr @uri)
          BD_VERSION_ENCODED=$(printf '%s' "${BD_VERSION_NAME}" | jq -sRr @uri)

          # BD search is substring-based; filter client-side for an exact match
          PROJECT_BODY=$(curl -sSf \
            "${BLACKDUCK_URL}/api/projects?q=name:${BD_PROJECT_ENCODED}&limit=10" \
            -H "Authorization: Bearer ${BEARER}" \
            -H "Accept: application/vnd.blackducksoftware.project-detail-4+json")
          PROJECT_HREF=$(echo "${PROJECT_BODY}" | jq -r \
            --arg name "${BD_PROJECT_NAME}" \
            '.items[] | select(.name == $name) | ._meta.href' | head -1)
          if [ -z "${PROJECT_HREF}" ] || [ "${PROJECT_HREF}" = "null" ]; then
            echo "ERROR: BlackDuck project '${BD_PROJECT_NAME}' not found."
            echo "Available matches: $(echo "${PROJECT_BODY}" | jq -r '.items[].name')"
            exit 1
          fi

          VERSION_BODY=$(curl -sSf \
            "${PROJECT_HREF}/versions?q=versionName:${BD_VERSION_ENCODED}&limit=10" \
            -H "Authorization: Bearer ${BEARER}" \
            -H "Accept: application/vnd.blackducksoftware.project-detail-5+json")
          VERSION_HREF=$(echo "${VERSION_BODY}" | jq -r \
            --arg ver "${BD_VERSION_NAME}" \
            '.items[] | select(.versionName == $ver) | ._meta.href' | head -1)
          if [ -z "${VERSION_HREF}" ] || [ "${VERSION_HREF}" = "null" ]; then
            echo "Version '${BD_VERSION_NAME}' not found — creating it..."
            VERSION_HREF=$(curl -sS -o /tmp/bd_create_resp.json -w "%{header_json}" -X POST \
              "${PROJECT_HREF}/versions" \
              -H "Authorization: Bearer ${BEARER}" \
              -H "Content-Type: application/vnd.blackducksoftware.project-detail-4+json" \
              -H "Accept: application/vnd.blackducksoftware.project-detail-5+json" \
              -d "{\"versionName\":\"${BD_VERSION_NAME}\",\"phase\":\"DEVELOPMENT\",\"distribution\":\"EXTERNAL\"}" \
              | jq -r '.location[0] // empty')
            if [ -z "${VERSION_HREF}" ]; then
              VERSION_HREF=$(curl -sSf \
                "${PROJECT_HREF}/versions?q=versionName:${BD_VERSION_ENCODED}&limit=10" \
                -H "Authorization: Bearer ${BEARER}" \
                -H "Accept: application/vnd.blackducksoftware.project-detail-5+json" \
                | jq -r --arg ver "${BD_VERSION_NAME}" \
                  '.items[] | select(.versionName == $ver) | ._meta.href' | head -1)
            fi
            if [ -z "${VERSION_HREF}" ] || [ "${VERSION_HREF}" = "null" ]; then
              echo "ERROR: Failed to create or locate version '${BD_VERSION_NAME}'."
              cat /tmp/bd_create_resp.json && exit 1
            fi
          fi

          echo "Uploading $(jq '.components|length' sbom-all-platforms.json) components to '${BD_PROJECT_NAME}' version '${BD_VERSION_NAME}'"

          HTTP_STATUS=$(curl -sS -o /tmp/bd_upload_resp.json -w "%{http_code}" -X POST \
            "${BLACKDUCK_URL}/api/scan/data" \
            -H "Authorization: Bearer ${BEARER}" \
            -F "file=@sbom-all-platforms.json;type=application/vnd.cyclonedx" \
            -F "projectName=${BD_PROJECT_NAME}" \
            -F "versionName=${BD_VERSION_NAME}" \
            -F "autocreate=true")

          echo "BlackDuck SBOM upload HTTP status: ${HTTP_STATUS}"
          if [[ "${HTTP_STATUS}" != "2"* ]]; then
            echo "ERROR: Upload failed with HTTP ${HTTP_STATUS}"
            cat /tmp/bd_upload_resp.json && exit 1
          fi
          echo "Upload complete. Components will appear in BlackDuck after async processing."
