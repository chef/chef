---
name: macos_verify

"on":
  pull_request_target:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: macos-verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CHEF_LICENSE: accept-no-persist
  CHEF_LICENSE_SERVER: http://hosted-license-service-lb-8000-606952349.us-west-2.elb.amazonaws.com:8000/
  FORCE_FFI_YAJL: ext

jobs:
  workflow_guard:
    uses: chef/chef/.github/workflows/workflow-change-guard.yml@main
    permissions:
      contents: read

  # ──────────────────────────────────────────────────────────────────
  # Job 1: Integration tests (equivalent to
  #         prep_and_run_tests.sh Integration)
  # ──────────────────────────────────────────────────────────────────
  integration:
    needs: workflow_guard
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
        ruby: ["3.4"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - run: bundle install

      - run: bundle exec rake spec:integration

  # ──────────────────────────────────────────────────────────────────
  # Job 2: Habitat plan build + test.darwin.sh (equivalent to
  #         verify-plan.sh)
  # ──────────────────────────────────────────────────────────────────
  habitat-plan:
    needs: workflow_guard
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      HAB_ORIGIN: gha
      HAB_BLDR_CHANNEL: base-2025
      HAB_REFRESH_CHANNEL: base-2025
      HAB_AUTH_TOKEN: ${{ secrets.HAB_AUTH_TOKEN }}
      HAB_LICENSE: accept-no-persist
      HAB_NONINTERACTIVE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Install Habitat CLI
        run: |
          curl https://raw.githubusercontent.com/habitat-sh/habitat/main/components/hab/install.sh | sudo -E bash -s -- -t aarch64-darwin
          hab license accept
          hab --version

      - name: Generate Habitat Origin Key
        run: hab origin key generate "$HAB_ORIGIN"

      - name: Build Habitat Package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          hab pkg build .

      - name: Install Habitat Package
        run: |
          source ./results/last_build.env
          echo "Installing: $pkg_ident ($pkg_artifact)"
          sudo -E hab pkg install "./results/$pkg_artifact"

      - name: Run test.darwin.sh
        run: |
          source ./results/last_build.env
          sudo -E ./habitat/tests/test.darwin.sh "$pkg_ident"

      - name: Export Habitat Package as macOS Tarball
        run: |
          source ./results/last_build.env
          echo "Exporting $pkg_ident as a tarball for aarch64-darwin..."
          sudo -E hab pkg export tar "$pkg_ident"
          tarball=$(find . -maxdepth 1 -name "*.tar.gz" | head -1)
          echo "MACOS_TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "Exported tarball: $tarball"

      - name: Upload macOS Tarball as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chef-infra-client-aarch64-darwin
          path: "*.tar.gz"
          retention-days: 30

      - name: Upload macOS Tarball to S3
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p upload
          find . -maxdepth 1 -name "*.tar.gz" | xargs -I {} cp {} upload/
          aws s3 sync upload/ s3://unstable-habitat-tarball/macos/ \
            --exclude "*" --include "*.tar.gz" \
            --region us-west-2
          echo "Uploaded tarball to s3://unstable-habitat-tarball/macos/"
