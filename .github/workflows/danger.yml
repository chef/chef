---
name: danger

on:
  pull_request_target:
    branches:
      - main

permissions: {}

concurrency:
  group: danger-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  danger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # oddly, needed to comment on PRs
      issues: write
    steps:
      # Note that we do NOT checkout the PR code, this is actually
      # 'main', but Danger rules can still use the API to read the PR
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dangerfile dependencies
        run: npm install js-yaml
      - uses: danger/danger-js@72540533c4f99bad772ba303be0eb4af6eddbdc4 # 14.1.0
        with:
          args: "--verbose --text-only -f"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
