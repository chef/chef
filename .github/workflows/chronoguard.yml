name: Chronoguard
on:
  pull_request:
    branches: [ main, chef-18 ]

jobs:
  chronoguard:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jaymzh/chronoguard@5ce29fb5d0599599021bd190a09e28ec1d45430b # main
        with:
          files: .github/workflows/allchecks.yml, .github/workflows/kitchen.yml, habitat/aarch64-linux/plan.sh, .github/dependabot.yml
