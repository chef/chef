---
name: kitchen

"on":
  pull_request:
  push:
    branches:
      - chef-18

concurrency:
  group: kitchen-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: kitchen-tests

jobs:
  win_x86_64:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - windows-2022
    runs-on: ${{ matrix.os }}
    env:
      CHEF_LICENSE: accept-no-persist
      KITCHEN_LOCAL_YAML: kitchen.exec.windows.yml
      HAB_LICENSE: accept
      HAB_AUTH_TOKEN: ${{ secrets.HAB_AUTH_TOKEN }}
      HAB_ORIGIN: chef
      HAB_BLDR_CHANNEL: base-2025
      HAB_BLDR_REFRESH_CHANNEL: base-2025
    steps:
    - uses: actions/checkout@v7
    - name: Upgrade Habitat CLI
      # The Chocolatey habitat package / runner image is pinned to an old hab
      # (1.6.1243) that cannot talk to the base-2025 channel. Install latest.
      shell: pwsh
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        iex ((New-Object System.Net.WebClient).DownloadString('https://raw.githubusercontent.com/habitat-sh/habitat/main/components/hab/install.ps1'))
        # The installer only updates the machine PATH registry entry, which later
        # steps/processes (e.g. Kitchen Test) won't pick up. Prepend it explicitly
        # via GITHUB_PATH so the upgraded hab wins over the old one already on PATH.
        $habDir = Split-Path (Get-Command hab).Source -Parent
        Add-Content -Path $env:GITHUB_PATH -Value $habDir
        hab --version
    - name: Install Chef
      uses: actionshub/chef-install@5.0.2
    - name: Kitchen Test
      run: kitchen test end-to-end-${{ matrix.os }}

  mac_arm64:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-15
          - macos-26
    runs-on: ${{ matrix.os }}
    env:
      CHEF_LICENSE: accept-no-persist
      KITCHEN_LOCAL_YAML: kitchen.exec.macos.yml
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          clean: true
      - name: Install Chef
        uses: actionshub/chef-install@5.0.2
      - name: Kitchen Test
        run: kitchen test end-to-end-${{ matrix.os }}

  docr_lnx_x86_64:
    strategy:
      fail-fast: false
      matrix:
        os:
          - amazonlinux-2023
          - almalinux-8
          - almalinux-9
          - almalinux-10
          - debian-11
          - debian-12
          - fedora-40
          - fedora-41
          - fedora-42
          - fedora-43
          - opensuse-leap-15
          - oraclelinux-8
          - oraclelinux-9
          - oraclelinux-10
          - rockylinux-8
          - rockylinux-9
          - rockylinux-10
          - ubuntu-2004
          - ubuntu-2204
          - ubuntu-2404
    runs-on: ubuntu-latest
    env:
      FORCE_FFI_YAJL: ext
      CHEF_LICENSE: accept-no-persist
      KITCHEN_LOCAL_YAML: kitchen.dokken.yml
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Chef
        uses: actionshub/chef-install@5.0.2
      - name: Kitchen Test
        run: kitchen test end-to-end-${{ matrix.os }}

